
name: Build QuickSRNet Android APK from ZIP

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'QuickSRNet_Phone_Test_Source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract uploaded project ZIP
        shell: bash
        run: |
          ZIP_FILE="QuickSRNet_Phone_Test_Source.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found in repository root"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/quick-srnet-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/quick-srnet-source"

          PROJECT_DIR="$(find "$RUNNER_TEMP/quick-srnet-source" -type f -name settings.gradle -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found inside ZIP"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Download QuickSRNetSmall model
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 \
            'https://huggingface.co/qualcomm/QuickSRNetSmall/resolve/977fb3092a065d512cd587c210cc1341b28b7161/QuickSRNetSmall.tflite' \
            -o app/src/main/assets/QuickSRNetSmall.tflite
          test "$(stat -c%s app/src/main/assets/QuickSRNetSmall.tflite)" -gt 1000

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Forest-Neural-Test-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
